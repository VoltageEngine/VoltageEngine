name: Release

# Cutting a release is what makes VoltageVersion.Engine mean anything. Plugin compatibility ranges and
# the project-version check both compare against that constant, so a tag that disagrees with it would
# ship an engine that lies about which version it is - and every check downstream would be measuring the
# wrong number.
#
# A tag builds, signs and publishes the editor for every desktop platform. The download page links to
# releases/latest/download/<asset>, so asset names never carry the version. A manual run builds the same
# packages as workflow artifacts without publishing, and may skip signing to test the packaging alone.
# Signing happens when its secrets are configured: macOS builds are then signed and notarized and the
# checksums GPG-signed. Without them macOS builds are ad-hoc signed. Windows builds are unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS packages and sign the checksums, if the secrets are configured
        type: boolean
        default: true

permissions:
  contents: read

env:
  SIGN: ${{ github.event_name == 'push' || inputs.sign }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: The tag must match VoltageVersion.Engine
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME#v}"
          VERSION=$(grep -o 'Engine = "[^"]*"' Voltage.Engine/VoltageVersion.cs | head -1 | sed 's/.*"\(.*\)"/\1/')

          echo "tag=$TAG  VoltageVersion.Engine=$VERSION"

          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $REF_NAME does not match VoltageVersion.Engine ($VERSION)."
            echo "::error::Bump the constant in Voltage.Engine/VoltageVersion.cs and retag."
            exit 1
          fi

      - name: Build the engine
        run: |
          dotnet build Voltage.Engine/Voltage.Engine.csproj -c Release
          dotnet build Voltage.Engine/Voltage.Engine.csproj -c Editor-Release

      - name: The generator must ship beside Voltage.dll
        run: |
          for cfg in Release Editor-Release; do
            f="Voltage.Engine/bin/$cfg/net8.0/Voltage.SourceGenerators.dll"
            test -f "$f" || { echo "::error::$f is missing - plugins would build without the generator"; exit 1; }
          done

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the editor
        run: dotnet build Voltage.Editor/Voltage.Editor.csproj -c Editor-Release -r win-x64 -p:VoltageSkipDevPlugins=true

      # Windows builds ship unsigned for now, so SmartScreen warns on each new release. Authenticode
      # signing (e.g. Azure Artifact Signing) goes between the build and the package when it is added.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "stage/Voltage Editor"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse Voltage.Editor/bin/Editor-Release/win-x64/* $stage
          Compress-Archive -Path $stage -DestinationPath dist/Voltage-Editor-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the editor
        run: dotnet build Voltage.Editor/Voltage.Editor.csproj -c Editor-Release -r linux-x64 -p:VoltageSkipDevPlugins=true

      - name: Package
        run: |
          mkdir -p dist "stage/voltage-editor"
          cp -R Voltage.Editor/bin/Editor-Release/linux-x64/. stage/voltage-editor/
          chmod +x stage/voltage-editor/Voltage.Editor
          tar -C stage -czf dist/Voltage-Editor-linux-x64.tar.gz voltage-editor

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      RID: ${{ matrix.rid }}
      HAS_APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the editor
        run: dotnet build Voltage.Editor/Voltage.Editor.csproj -c Editor-Release -r "$RID" -p:VoltageSkipDevPlugins=true

      - name: Make the app bundle
        run: |
          VERSION=$(grep -o 'Engine = "[^"]*"' Voltage.Engine/VoltageVersion.cs | head -1 | sed 's/.*"\(.*\)"/\1/')
          APP="stage/Voltage Editor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "Voltage.Editor/bin/Editor-Release/$RID/." "$APP/Contents/MacOS/"
          sed "s/__VERSION__/${VERSION%%-*}/g" tools/macos/Info.plist > "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/Voltage.Editor"
          ln -s /Applications stage/Applications

      # Developer ID certificate as a base64 .p12 in a throwaway keychain that dies with the runner.
      - name: Import the signing certificate
        if: env.SIGN == 'true' && env.HAS_APPLE_ID == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      # Inside-out: every Mach-O file first, then the bundle. --deep is not used because it signs nested
      # code with the bundle's entitlements and hides which file failed.
      - name: Sign the app
        if: env.SIGN == 'true' && env.HAS_APPLE_ID == 'true'
        env:
          IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="stage/Voltage Editor.app"
          ENT=tools/macos/Voltage.Editor.entitlements
          find "$APP/Contents/MacOS" -type f | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --force --timestamp --options runtime --entitlements "$ENT" --sign "$IDENTITY" "$f"
            fi
          done
          codesign --force --timestamp --options runtime --entitlements "$ENT" --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # Apple Silicon refuses to run unsigned code, and reports the app as damaged without this.
      - name: Ad-hoc sign the app
        if: env.SIGN != 'true' || env.HAS_APPLE_ID != 'true'
        run: codesign --force --deep --sign - "stage/Voltage Editor.app"

      - name: Make the disk image
        run: |
          mkdir -p dist
          hdiutil create -volname "Voltage Editor" -srcfolder stage -ov -format UDZO "dist/Voltage-Editor-$RID.dmg"

      - name: Notarize
        if: env.SIGN == 'true' && env.HAS_APPLE_ID == 'true'
        env:
          IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          DMG="dist/Voltage-Editor-$RID.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          echo "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 30m
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_GPG: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Voltage-Editor-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the checksums
        if: env.SIGN == 'true' && env.HAS_GPG == 'true'
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          rm -rf "$GNUPGHOME"

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: release-packages
          path: dist/*

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Engine version `${{ github.ref_name }}`.

            Download the editor for your platform from the [download page](https://voltageengine.github.io/VoltageEngine/download) or the files below.

            Plugins declaring an `EngineVersion` range that excludes this version will report a
            compatibility warning in the Plugin Manager and at build time. Projects recording an older
            engine version keep opening; the editor offers to move them up.
